services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: competitor_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./docs/reports:/app/reports

  worker:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - backend
      - redis
      - db
    volumes:
      - ./backend:/app
      - ./docs/reports:/app/reports

  beat:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      - backend
      - redis
      - db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
